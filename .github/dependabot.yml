version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # react/react-dom and playwright/@playwright/test are each pinned to one
    # version and must be raised together. Ungrouped, dependabot opens a PR per
    # package and lifts half a pair, which fails in a way that never names the
    # cause: a react/react-dom skew breaks every component suite, and a
    # playwright skew reports "No tests found". Exact names, not prefixes, so
    # "react" cannot sweep in react-is.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      playwright:
        patterns:
          - "playwright"
          - "@playwright/test"
    ignore:
      # TypeScript 7 ships no compiler API, and `next build` 16.2 needs one:
      # "TypeScript 7.0.2 does not provide the compiler API required by
      # Next.js" (checked 2026-10-20). Lift this when Next.js supports it.
      - dependency-name: "typescript"
        versions: [">=7"]
